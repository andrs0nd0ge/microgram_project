<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Microgram</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-KK94CHFLLe+nY2dmCWGMq91rCGa5gtU4mk92HdvYe+M/SXH301p5ILy+dN9+nJOZ" crossorigin="anonymous">
    <link href="style.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.4/font/bootstrap-icons.css">
</head>
<body style="background-color: #eee">
<nav class="navbar navbar-expand-lg custom-navbar-bg" id="mainNavbar">
    <div class="container">
        <a class="navbar-brand" href="/static"><!--suppress CheckImageSize -->
            <img alt="Microgram Logo" src="images/microgram-logo.png"
                 width="70"></a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent"
                aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarSupportedContent">
            <ul class="navbar-nav me-auto mb-lg-0">
                <li class="nav-item">
                    <button aria-current="page" class="nav-link text-white">Home</button>
                </li>
            </ul>
            <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
                <li class="nav-item">
                    <button class="me-3 p-1 nav-link text-white" onclick="toggleSplashScreen()">Register</button>
                </li>
            </ul>
            <ul class="navbar-nav mb-2 mb-lg-0">
                <li class="nav-item">
                    <button class="p-1 nav-link text-white">Log Out</button>
                </li>
            </ul>
        </div>
    </div>
</nav>
<div class="d-none justify-content-center bg-primary background" id="bg" style="z-index: 1">
    <div id="splash">
        <button class="hideSplashButton btn text-white" onclick="toggleSplashScreen()">Close</button>

        <div class="testbox row">
            <h1 class="registration-header">Registration</h1>

            <form class="registration-form" id="registration-form">
                <hr>

                <div class="col">
                    <!--                    <label id="icon" for="name"><i class="bi bi-envelope-fill"></i></label>-->
                    <input class="form-control border" name="email" placeholder="Full Name" required type="text"/>
                </div>

                <div class="col">
                    <!--                    <label id="icon" for="name"><i class="bi bi-person-badge-fill"></i></label>-->
                    <input class="form-control border" name="name" placeholder="Username" required type="text"/>
                </div>

                <div class="col">
                    <!--                    <label id="icon" for="name"><i class="bi bi-person-fill"></i></label>-->
                    <input class="form-control border" name="username" placeholder="Email" required type="email"/>
                </div>

                <div class="col">
                    <!--                    <label id="icon" for="name"><i class="bi bi-shield-shaded"></i></label>-->
                    <input class="form-control border" name="password" placeholder="Password" required type="password"/>
                </div>

                <div class="text-center">
                    <button class="w-100 btn btn-outline-primary" type="submit">Sign Up</button>
                </div>
            </form>
        </div>
    </div>
</div>
<!--<div class="d-flex justify-content-center my-5" id="showSplash">-->
<!--    <button class="showSplashButton btn" onclick="toggleSplashScreen()">Show Splash Screen</button>-->
<!--</div>-->
</body>
<script src="script.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js" integrity="sha384-ENjdO4Dr2bkBIFxQpeoTz1HIcje39Wm4jDKdf19U8gI4ddQ3GYNS7NTKfAdVQSZe" crossorigin="anonymous"></script>
</html>
